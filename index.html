<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zesto</title>

    <meta name="description" content="Zesto - Commandez vos plats simplement et rapidement.">
</head>

<body>

    <header>
        <h1>🍽️ Zesto</h1>
        <p>Votre repas préféré, simplement.</p>
    </header>

    <main>
      <input 
    type="search" 
    placeholder="🔍 Rechercher un restaurant ou un plat..."
    aria-label="Rechercher un restaurant ou un plat"> 
        <button id="locationButton">
    📍 Utiliser ma position
</button>

<p id="locationStatus"></p>
        <h2>Qu'avez-vous envie de manger ?</h2>

        <div class="categories">

    <button>🍔 Burgers</button>
    <button>🍕 Pizza</button>
    <button>🍣 Sushi</button>
    <button>🍗 Poulet</button>
    <button>🌮 Tacos</button>
    <button>🌯 Wraps</button>
    <button>🍝 Pâtes</button>
    <button>🍜 Nouilles</button>
    <button>🍚 Riz</button>
    <button>🥘 Plats marocains</button>
    <button>🍛 Cuisine africaine</button>
    <button>🥩 Grillades</button>
    <button>🍟 Fast-food</button>
    <button>🥗 Salades</button>
    <button>🥪 Sandwichs</button>
    <button>🥙 Shawarma</button>
    <button>🍳 Petit-déjeuner</button>
    <button>🥞 Crêpes</button>
    <button>🧇 Gaufres</button>
    <button>🍰 Desserts</button>
    <button>🍦 Glaces</button>
    <button>🍩 Donuts</button>
    <button>🍫 Chocolat</button>
    <button>🥤 Boissons</button>
    <button>☕ Café</button>
    <button>🧃 Jus</button>

</div>

        <h2>Restaurants</h2>

<div id="restaurantsList">
    <p>Choisissez une catégorie pour voir les restaurants.</p>
</div>
        
    </main>
<script>
    const locationButton = document.getElementById("locationButton");
    const locationStatus = document.getElementById("locationStatus");

    locationButton.addEventListener("click", () => {
        if (!navigator.geolocation) {
            locationStatus.textContent = "La localisation n'est pas disponible.";
            return;
        }

        locationStatus.textContent = "📍 Recherche de votre position...";

        navigator.geolocation.getCurrentPosition(
            (position) => {
                locationStatus.textContent = "✅ Position trouvée !";
            },
            () => {
                locationStatus.textContent = "❌ Autorisation refusée.";
            }
        );
    });

    <script>
    const restaurants = {
        "🍣 Sushi": [
            "Sushi House",
            "Tokyo Sushi",
            "Sushi Time"
        ],

        "🍔 Burgers": [
            "Burger House",
            "Big Burger",
            "Burger Time"
        ],

        "🍕 Pizza": [
            "Pizza House",
            "Pizza Time",
            "La Bella Pizza"
        ],

        "🥙 Shawarma": [
            "Shawarma House",
            "Shawarma Time",
            "Le Petit Shawarma"
        ],

        "🍗 Poulet": [
            "Chicken House",
            "Chicken Time",
            "Poulet Express"
        ]
    };

    const categoryButtons =
        document.querySelectorAll(".categories button");

    const restaurantsList =
        document.getElementById("restaurantsList");

    categoryButtons.forEach(button => {

        button.addEventListener("click", () => {

            const category = button.textContent;

            const selectedRestaurants =
                restaurants[category];

            if (!selectedRestaurants) {
                restaurantsList.innerHTML =
                    "<p>Aucun restaurant disponible pour cette catégorie pour le moment.</p>";
                return;
            }

            restaurantsList.innerHTML =
                "<h3>" + category + "</h3>" +
                selectedRestaurants
                    .map(restaurant => "<p>🍽️ " + restaurant + "</p>")
                    .join("");
        });

    });
</script>

    categoryButtons.forEach(button => {
        button.addEventListener("click", () => {
            alert("Vous avez choisi : " + button.textContent);
        });
    });
</script>

</body>
</html>

    
</body>
</html>
