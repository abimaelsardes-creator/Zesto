<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zesto - Commandez simplement</title>

    <meta
        name="description"
        content="Zesto - Découvrez des restaurants et commandez vos plats simplement et rapidement."
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f6f6;
            color: #222;
        }

        header {
            background: #ff6b00;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 34px;
        }

        header p {
            margin: 8px 0 0;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        .search-box {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .location-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .location-button:hover {
            background: #444;
        }

        #locationStatus {
            text-align: center;
            min-height: 24px;
        }

        h2 {
            margin-top: 30px;
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .category-button {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            background: white;
            cursor: pointer;
            font-size: 15px;
        }

        .category-button:hover {
            background: #ff6b00;
            color: white;
            border-color: #ff6b00;
        }

        #restaurantsList {
            display: grid;
            gap: 15px;
        }

        .restaurant {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .restaurant h3 {
            margin-top: 0;
            font-size: 21px;
        }

        .restaurant button,
        .add-button,
        .checkout-button {
            border: none;
            border-radius: 9px;
            background: #ff6b00;
            color: white;
            padding: 12px 16px;
            cursor: pointer;
            font-size: 15px;
        }

        .restaurant button:hover,
        .add-button:hover,
        .checkout-button:hover {
            background: #e85f00;
        }

        .message {
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        #menuSection {
            display: none;
            margin-top: 30px;
        }

        .menu-header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .menu-item {
            background: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .menu-item h4 {
            margin: 0 0 7px;
        }

        .menu-item p {
            margin: 0;
            color: #666;
        }

        .price {
            font-weight: bold;
            color: #ff6b00;
            margin-top: 8px !important;
        }

        #cartSection {
            display: none;
            margin-top: 30px;
        }

        .cart-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .quantity-buttons button {
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            padding: 5px 9px;
            cursor: pointer;
        }

        .remove-button {
            border: none;
            background: #eee;
            border-radius: 6px;
            padding: 6px 9px;
            cursor: pointer;
        }

        .cart-total {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        #orderSection {
            display: none;
            margin-top: 30px;
        }

        .order-box {
            background: white;
            padding: 20px;
            border-radius: 15px;
        }

        .order-input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 9px;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .back-button {
            border: none;
            background: #eee;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .cart-button {
            position: fixed;
            right: 18px;
            bottom: 18px;
            border: none;
            border-radius: 50px;
            background: #ff6b00;
            color: white;
            padding: 15px 20px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 100;
        }

        .success {
            background: #e8f8ed;
            color: #176b35;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            main {
                padding: 15px;
            }

            .menu-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .menu-item button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🍽️ Zesto</h1>
    <p>Votre repas préféré, simplement.</p>
</header>

<main>

    <!-- RECHERCHE -->

    <input
        id="searchInput"
        class="search-box"
        type="search"
        placeholder="🔍 Rechercher un restaurant ou un plat..."
    >

    <!-- LOCALISATION -->

    <button id="locationButton" class="location-button">
        📍 Utiliser ma position
    </button>

    <p id="locationStatus"></p>

    <!-- CATEGORIES -->

    <h2>Qu'avez-vous envie de manger ?</h2>

    <div class="categories">

        <button class="category-button">🍔 Burgers</button>
        <button class="category-button">🍕 Pizza</button>
        <button class="category-button">🍣 Sushi</button>
        <button class="category-button">🍗 Poulet</button>
        <button class="category-button">🌮 Tacos</button>
        <button class="category-button">🌯 Wraps</button>
        <button class="category-button">🍝 Pâtes</button>
        <button class="category-button">🍜 Nouilles</button>
        <button class="category-button">🍚 Riz</button>
        <button class="category-button">🥘 Plats marocains</button>
        <button class="category-button">🍛 Cuisine africaine</button>
        <button class="category-button">🥩 Grillades</button>
        <button class="category-button">🍟 Fast-food</button>
        <button class="category-button">🥗 Salades</button>
        <button class="category-button">🥪 Sandwichs</button>
        <button class="category-button">🥙 Shawarma</button>
        <button class="category-button">🍳 Petit-déjeuner</button>
        <button class="category-button">🥞 Crêpes</button>
        <button class="category-button">🧇 Gaufres</button>
        <button class="category-button">🍰 Desserts</button>
        <button class="category-button">🍦 Glaces</button>
        <button class="category-button">🍩 Donuts</button>
        <button class="category-button">🍫 Chocolat</button>
        <button class="category-button">🥤 Boissons</button>
        <button class="category-button">☕ Café</button>
        <button class="category-button">🧃 Jus</button>

    </div>

    <!-- RESTAURANTS -->

    <h2>Restaurants</h2>

    <div id="restaurantsList">
        <div class="message">
            Choisissez une catégorie pour voir les restaurants disponibles.
        </div>
    </div>

    <!-- MENU -->

    <section id="menuSection">

        <div class="menu-header">
            <button class="back-button" onclick="backToRestaurants()">
                ← Retour aux restaurants
            </button>

            <h2 id="menuRestaurantName"></h2>

            <p>
                Choisissez vos plats et ajoutez-les au panier.
            </p>
        </div>

        <div id="menuList"></div>

    </section>

    <!-- PANIER -->

    <section id="cartSection">

        <div class="cart-box">

            <button class="back-button" onclick="closeCart()">
                ← Continuer mes achats
            </button>

            <h2>🛒 Mon panier</h2>

            <div id="cartList"></div>

            <div id="cartTotal" class="cart-total"></div>

            <button
                id="checkoutButton"
                class="checkout-button"
                onclick="showOrderForm()"
            >
                📦 Passer la commande
            </button>

        </div>

    </section>

    <!-- COMMANDE -->

    <section id="orderSection">

        <div class="order-box">

            <button class="back-button" onclick="closeOrderForm()">
                ← Retour au panier
            </button>

            <h2>📦 Finaliser ma commande</h2>

            <input
                id="customerName"
                class="order-input"
                type="text"
                placeholder="Votre nom"
            >

            <input
                id="customerPhone"
                class="order-input"
                type="tel"
                placeholder="Votre numéro de téléphone"
            >

            <input
                id="customerAddress"
                class="order-input"
                type="text"
                placeholder="Votre adresse de livraison"
            >

            <button
                class="checkout-button"
                onclick="confirmOrder()"
            >
                ✅ Confirmer la commande
            </button>

            <div id="orderMessage"></div>

        </div>

    </section>

</main>

<!-- BOUTON PANIER -->

<button
    id="cartButton"
    class="cart-button"
    onclick="openCart()"
>
    🛒 Panier (0)
</button>

        ],

        "Chicken House": [

        ],

        ],

        ],

        "Fast Food Zesto": [
            {
                name: "Menu Zesto",
                description: "Burger + frites + boisson",
                price: 65
            },
            {
                name: "Chicken Menu",
                description: "Poulet + frites + boisson",
                price: 60
            }
        ]

    };


    /* =====================================================
       PANIER
    ===================================================== */

    let cart = [];


    /* =====================================================
       AFFICHER LES RESTAURANTS
    ===================================================== */

    const categoryButtons =
        document.querySelectorAll(".category-button");

    const restaurantsList =
        document.getElementById("restaurantsList");


    categoryButtons.forEach(function(button) {

        button.addEventListener("click", function() {

            const category =
                button.textContent.trim();

            showRestaurants(category);

        });

    });


    function showRestaurants(category) {

        const selectedRestaurants =
            restaurants[category];

        document.getElementById("menuSection").style.display =
            "none";

        document.getElementById("cartSection").style.display =
            "none";

        document.getElementById("orderSection").style.display =
            "none";

        if (!selectedRestaurants) {

            restaurantsList.innerHTML = `
                <div class="message">
                    Aucun restaurant disponible dans cette catégorie pour le moment.
                </div>
            `;

            return;
        }


        restaurantsList.innerHTML = "";


        selectedRestaurants.forEach(function(restaurant) {

            const element =
                document.createElement("div");

            element.className = "restaurant";

            element.innerHTML = `
                <h3>🍽️ ${restaurant.name}</h3>
                <p>${restaurant.rating}</p>
                <p>🛵 Livraison : ${restaurant.time}</p>

                <button onclick="openMenu('${restaurant.name}')">
                    📋 Voir le menu
                </button>
            `;

            restaurantsList.appendChild(element);

        });

    }


    /* =====================================================
       AFFICHER LE MENU
    ===================================================== */

    function openMenu(restaurantName) {

        const menu =
            menus[restaurantName] || [];

        document.getElementById("menuSection").style.display =
            "block";

        document.getElementById("cartSection").style.display =
            "none";

        document.getElementById("orderSection").style.display =
            "none";

        document.getElementById("menuRestaurantName").textContent =
            "🍽️ " + restaurantName;

        const menuList =
            document.getElementById("menuList");

        menuList.innerHTML = "";


        if (menu.length === 0) {

            menuList.innerHTML = `
                <div class="message">
                    Menu bientôt disponible.
                </div>
            `;

            return;
        }


        menu.forEach(function(item, index) {

            const element =
                document.createElement("div");

            element.className = "menu-item";

            element.innerHTML = `
                <div>
                    <h4>${item.name}</h4>
                    <p>${item.description}</p>
                    <p class="price">${item.price} DH</p>
                </div>

                <button
                    class="add-button"
                    onclick="addToCart('${restaurantName}', '${item.name}', ${item.price})"
                >
                    ➕ Ajouter
                </button>
            `;

            menuList.appendChild(element);

        });

        document.getElementById("menuSection")
            .scrollIntoView({
                behavior: "smooth"
            });

    }


    /* =====================================================
       AJOUTER AU PANIER
    ===================================================== */

    function addToCart(
        restaurant,
        name,
        price
    ) {

        const existing =
            cart.find(function(item) {

                return (
                    item.restaurant === restaurant &&
                    item.name === name
                );

            });


        if (existing) {

            existing.quantity++;

        } else {

            cart.push({

                restaurant: restaurant,
                name: name,
                price: price,
                quantity: 1

            });

        }


        updateCart();

        alert("✅ " + name + " a été ajouté au panier.");

    }


    /* =====================================================
       METTRE À JOUR LE PANIER
    ===================================================== */

    function updateCart() {

        const cartButton =
            document.getElementById("cartButton");

        const totalQuantity =
            cart.reduce(
                function(total, item) {
                    return total + item.quantity;
                },
                0
            );


        cartButton.textContent =
            "🛒 Panier (" + totalQuantity + ")";

    }


    /* =====================================================
       OUVRIR LE PANIER
    ===================================================== */

    function openCart() {

        document.getElementById("menuSection").style.display =
            "none";

        document.getElementById("orderSection").style.display =
            "none";

        document.getElementById("cartSection").style.display =
            "block";


        renderCart();


        document.getElementById("cartSection")
            .scrollIntoView({
                behavior: "smooth"
            });

    }


    /* =====================================================
       AFFICHER LE PANIER
    ===================================================== */

    function renderCart() {

        const cartList =
            document.getElementById("cartList");

        const cartTotal =
            document.getElementById("cartTotal");


        if (cart.length === 0) {

            cartList.innerHTML = `
                <div class="message">
                    🛒 Votre panier est vide.
                </div>
            `;

            cartTotal.textContent = "";

            return;

        }


        cartList.innerHTML = "";


        let total = 0;


        cart.forEach(function(item, index) {

            const itemTotal =
                item.price * item.quantity;

            total += itemTotal;


            const element =
                document.createElement("div");

            element.className = "cart-item";

            element.innerHTML = `

                <div>
                    <strong>${item.name}</strong>
                    <br>
                    <small>${item.restaurant}</small>
                    <br>
                    ${itemTotal} DH
                </div>

                <div class="quantity-buttons">

                    <button onclick="changeQuantity(${index}, -1)">
                        −
                    </button>

                    <strong>${item.quantity}</strong>

                    <button onclick="changeQuantity(${index}, 1)">
                        +
                    </button>

                    <button
                        class="remove-button"
                        onclick="removeFromCart(${index})"
                    >
                        🗑️
                    </button>

                </div>

            `;

            cartList.appendChild(element);

        });


        cartTotal.textContent =
            "Total : " + total + " DH";

    }


    /* =====================================================
       CHANGER QUANTITÉ
    ===================================================== */

    function changeQuantity(index, change) {

        cart[index].quantity += change;


        if (cart[index].quantity <= 0) {

            cart.splice(index, 1);

        }


        updateCart();

        renderCart();

    }


    /* =====================================================
       SUPPRIMER DU PANIER
    ===================================================== */

    function removeFromCart(index) {

        cart.splice(index, 1);

        updateCart();

        renderCart();

    }


    /* =====================================================
       FORMULAIRE DE COMMANDE
    ===================================================== */

    function showOrderForm() {

        if (cart.length === 0) {

            alert("🛒 Votre panier est vide.");

            return;

        }


        document.getElementById("cartSection").style.display =
            "none";

        document.getElementById("orderSection").style.display =
            "block";


        document.getElementById("orderSection")
            .scrollIntoView({
                behavior: "smooth"
            });

    }


    function closeOrderForm() {

        document.getElementById("orderSection").style.display =
            "none";

        document.getElementById("cartSection").style.display =
            "block";

    }


    /* =====================================================
       CONFIRMER COMMANDE
    ===================================================== */

    function confirmOrder() {

        const name =
            document.getElementById("customerName").value.trim();

        const phone =
            document.getElementById("customerPhone").value.trim();

        const address =
            document.getElementById("customerAddress").value.trim();


        if (
            name === "" ||
            phone === "" ||
            address === ""
        ) {

            alert(
                "⚠️ Veuillez remplir votre nom, votre numéro et votre adresse."
            );

            return;

        }


        document.getElementById("orderMessage").innerHTML = `

            <div class="success">

                ✅ Votre commande a été préparée !

                <br><br>

                Merci ${name} ❤️

                <br><br>

                📞 ${phone}

                <br>

                📍 ${address}

                <br><br>

                <strong>
                    Cette version est encore une démonstration.
                    Le système réel de commande sera connecté plus tard.
                </strong>

            </div>

        `;

    }


    /* =====================================================
       RETOUR AUX RESTAURANTS
    ===================================================== */

    function backToRestaurants() {

        document.getElementById("menuSection").style.display =
            "none";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    function closeCart() {

        document.getElementById("cartSection").style.display =
            "none";

    }


    /* =====================================================
       RECHERCHE
    ===================================================== */

    const searchInput =
        document.getElementById("searchInput");


    searchInput.addEventListener(
        "input",
        function() {

            const search =
                searchInput.value
                    .toLowerCase()
                    .trim();


            if (search === "") {

                restaurantsList.innerHTML = `
                    <div class="message">
                        Choisissez une catégorie pour voir les restaurants disponibles.
                    </div>
                `;

                return;

            }


            const results = [];


            Object.keys(restaurants)
                .forEach(function(category) {

                    restaurants[category]
                        .forEach(function(restaurant) {

                            const restaurantMatch =
                                restaurant.name
                                    .toLowerCase()
                                    .includes(search);

                            const categoryMatch =
                                category
                                    .toLowerCase()
                                    .includes(search);


                            if (
                                restaurantMatch ||
                                categoryMatch
                            ) {

                                results.push({
                                    restaurant: restaurant,
                                    category: category
                                });

                            }

                        });

                });


            restaurantsList.innerHTML = "";


            if (results.length === 0) {

                restaurantsList.innerHTML = `
                    <div class="message">
                        ❌ Aucun restaurant trouvé.
                    </div>
                `;

                return;

            }


            results.forEach(function(result) {

                const restaurant =
                    result.restaurant;


                const element =
                    document.createElement("div");

                element.className = "restaurant";

                element.innerHTML = `

                    <h3>🍽️ ${restaurant.name}</h3>

                    <p>
                        ${result.category}
                    </p>

                    <p>
                        ${restaurant.rating}
                    </p>

                    <p>
                        🛵 Livraison : ${restaurant.time}
                    </p>

                    <button onclick="openMenu('${restaurant.name}')">
                        📋 Voir le menu
                    </button>

                `;

                restaurantsList.appendChild(element);

            });

        }
    );


    /* =====================================================
       GÉOLOCALISATION
    ===================================================== */

    const locationButton =
        document.getElementById("locationButton");

    const locationStatus =
        document.getElementById("locationStatus");


    locationButton.addEventListener(
        "click",
        function() {

            if (!navigator.geolocation) {

                locationStatus.textContent =
                    "❌ La localisation n'est pas disponible.";

                return;

            }


            locationStatus.textContent =
                "📍 Recherche de votre position...";


            navigator.geolocation.getCurrentPosition(

                function(position) {

                    const latitude =
                        position.coords.latitude;

                    const longitude =
                        position.coords.longitude;


                    console.log(
                        "Position :",
                        latitude,
                        longitude
                    );


                    locationStatus.textContent =
                        "✅ Position trouvée !";

                },

                function() {

                    locationStatus.textContent =
                        "❌ Autorisation de localisation refusée.";

                }

            );

        }
    );


    /* =====================================================
       INITIALISATION
    ===================================================== */

    updateCart();

</script>

</body>
</html>
